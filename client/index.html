<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('atlas_theme');
          var dark = ['shadowed-alchemist','nocturnal-amethyst','abyssal-trench','whispering-woods','crimson-velvet'];
          var backgrounds = {
            'shadowed-alchemist': '#07080A', 'nocturnal-amethyst': '#050408',
            'abyssal-trench': '#03060C', 'whispering-woods': '#030806',
            'crimson-velvet': '#080304', 'light-porcelain': '#F5F6F3',
            'light-sandstone': '#F6F0E7', 'light-sage': '#EFF4EF',
            'light-lavender': '#F4F1F8', 'light-sky': '#EFF5F9'
          };
          if (theme && backgrounds[theme]) {
            var root = document.documentElement;
            root.setAttribute('data-theme', theme);
            root.style.colorScheme = dark.indexOf(theme) >= 0 ? 'dark' : 'light';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', backgrounds[theme]);
            root.style.backgroundColor = backgrounds[theme];
          }
        } catch (_) {}
      })();
    </script>
    <meta name="description" content="Amstreem Atlas — your private operating system for what matters." />
    <link rel="icon" type="image/svg+xml" href="/assets/brand/amstreem-symbol.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/amstreem-apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Amstreem Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Scheherazade+New:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&family=Lateef:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/supabase-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
