name: Atlas staging checks

on:
  push:
    branches:
      - atlas-next
      - atlas-v2
  pull_request:
    branches:
      - atlas-next
      - atlas-v2

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Frozen Qur'an integrity gate
        run: npm run check:frozen
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Test suite
        run: npm test
      - name: Dependency audit
        run: npm audit
