name: Atlas staging quality checks

on:
  push:
    branches:
      - atlas-next
  pull_request:
    branches:
      - atlas-next

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --include=dev
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm audit
