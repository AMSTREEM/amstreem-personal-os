name: Personal OS checks

on:
  push:
    branches: [main, audit-and-hardening, atlas-next, atlas-v2]
  pull_request:
    branches: [main, audit-and-hardening, atlas-next, atlas-v2]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run check:frozen
      - run: npm run check:contrast
      - run: npm audit
      - run: node --check server.js
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
