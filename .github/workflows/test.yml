name: Personal OS checks

on:
  push:
    branches: [main, audit-and-hardening, atlas-original-polish]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: node --check server.js
      - run: node --check public/app.js
      - run: npm test
