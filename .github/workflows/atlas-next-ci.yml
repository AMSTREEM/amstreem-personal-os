name: Atlas Next CI

on:
  push:
    branches: [atlas-next]
  pull_request:
    branches: [audit-and-hardening]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Type-check frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Run backend tests
        run: npm test
