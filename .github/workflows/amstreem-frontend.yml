name: Amstreem frontend verification

on:
  push:
    branches:
      - amstreem/intelligence-memory-foundation
    paths:
      - "amstreem-new/**"
      - ".github/workflows/amstreem-frontend.yml"
  pull_request:
    branches:
      - amstreem-clean-start
    paths:
      - "amstreem-new/**"
      - ".github/workflows/amstreem-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amstreem-new
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
